<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Documents</title>
  <style>
    :root {
      --bg: #f5f5f2;
      --card: #fff;
      --text: #202020;
      --muted: #777;
      --line: #deded8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(1180px, calc(100% - 48px));
      margin: auto;
      padding: 72px 0;
    }

    header { margin-bottom: 42px; }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 54px);
      font-weight: 400;
      letter-spacing: -.035em;
    }

    .intro {
      max-width: 620px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .pdf-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .pdf-card {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
      overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .pdf-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 35px rgba(0,0,0,.08);
    }

    .thumbnail {
      aspect-ratio: 4 / 3;
      background: #ecece8;
      overflow: hidden;
      position: relative;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: #999;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .info { padding: 17px 18px 20px; }

    .number {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .title {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .open {
      font-size: 12px;
      color: var(--muted);
    }


    /* PDF preview modal */
    .pdf-modal { position:fixed; inset:0; z-index:1000; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(0,0,0,.72); }
    .pdf-modal.is-open { display:flex; }
    .pdf-modal-content { position:relative; width:min(1100px,96vw); height:min(92vh,900px); background:#fff; box-shadow:0 20px 70px rgba(0,0,0,.35); overflow:hidden; }
    .pdf-modal-header { height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 14px 0 18px; border-bottom:1px solid #e5e5e5; background:#fff; }
    .pdf-modal-title { font-size:13px; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:16px; }
    .pdf-close { width:32px; height:32px; border:0; background:transparent; cursor:pointer; font-size:24px; line-height:1; color:#555; }
    .pdf-close:hover { color:#000; }
    .pdf-frame { width:100%; height:calc(100% - 48px); border:0; display:block; }
    .pdf-loading { position:absolute; inset:48px 0 0; display:grid; place-items:center; pointer-events:none; color:#888; font-size:12px; background:#fff; }
    @media (max-width:560px) { .pdf-modal { padding:0; } .pdf-modal-content { width:100vw; height:100vh; } }

    @media (max-width: 900px) {
      .pdf-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 28px, 560px);
        padding: 42px 0;
      }
      .pdf-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="page">
    <header>
      <div class="eyebrow">PDF Library</div>
      <h1>Project Documents</h1>
      <p class="intro">Select a document below to open the full PDF.</p>
    </header>

    <section class="pdf-grid" id="pdfGrid"></section>
  </main>

  <div class="pdf-modal" id="pdfModal" aria-hidden="true">
    <div class="pdf-modal-content" role="dialog" aria-modal="true" aria-label="PDF preview">
      <div class="pdf-modal-header">
        <div class="pdf-modal-title" id="pdfModalTitle">PDF Preview</div>
        <button class="pdf-close" id="pdfClose" type="button" aria-label="Close PDF preview">×</button>
      </div>
      <div class="pdf-loading" id="pdfLoading">Loading PDF…</div>
      <iframe class="pdf-frame" id="pdfFrame" title="PDF preview" loading="lazy"></iframe>
    </div>
  </div>

  <script>
    /*
      ============================================================
      EDIT ONLY THIS SECTION
      ============================================================

      For each PDF, paste the COMPLETE Google Drive URL.

      Example:
      https://drive.google.com/file/d/1ABC123XYZ/view?usp=sharing

      The website uses that URL for the PDF button.
      It also extracts the Drive file ID automatically to request
      a thumbnail generated from the first page of the PDF.

      The PDF must be shared so the intended visitors can view it.
    */

    const PDFs = [
      {
        title: "Project 01",
        url: "https://drive.google.com/file/d/10uyOrFSpNrU8Mvc-esbG7ObIA4FD-2fa/view?usp=sharing"
      },
      {
        title: "Project 02",
        url: "https://drive.google.com/file/d/1Lo6UnWxlgTSBTxUPWlfBu3vcFm6ZvPe2/view?usp=sharing"
      },
      {
        title: "Project 03",
        url: ""
      },
      {
        title: "Project 04",
        url: ""
      }
    ];

    function getDriveFileId(url) {
      const match = url.match(/\/file\/d\/([^/]+)/);
      return match ? match[1] : "";
    }

    // Google Drive's thumbnail endpoint normally returns a preview
    // generated from the first page of a PDF.
    function driveThumbnail(url) {
      const id = getDriveFileId(url);
      return id
        ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1200`
        : "";
    }

    function openPDF(pdf) {
      const modal = document.getElementById("pdfModal");
      const frame = document.getElementById("pdfFrame");
      const title = document.getElementById("pdfModalTitle");
      const loading = document.getElementById("pdfLoading");
      const id = getDriveFileId(pdf.url);

      if (!id) {
        window.open(pdf.url, "_blank", "noopener,noreferrer");
        return;
      }

      // Google Drive's preview viewer opens inside the modal.
      frame.src = `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`;
      title.textContent = pdf.title;
      loading.style.display = "grid";
      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      frame.onload = () => { loading.style.display = "none"; };
    }

    function closePDF() {
      const modal = document.getElementById("pdfModal");
      const frame = document.getElementById("pdfFrame");
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      frame.src = "";
    }

    function renderPDFs() {
      const grid = document.getElementById("pdfGrid");

      grid.innerHTML = PDFs
        .filter(pdf => pdf.url)
        .map((pdf, index) => `
          <a class="pdf-card" href="${pdf.url}" data-pdf-index="${index}">
            <div class="thumbnail">
              <img src="${driveThumbnail(pdf.url)}"
                   alt="${pdf.title}"
                   loading="lazy"
                   onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
              <div class="placeholder" style="display:none;">PDF Preview</div>
            </div>
            <div class="info">
              <div class="number">${String(index + 1).padStart(2, "0")}</div>
              <div class="title">${pdf.title}</div>
              <div class="open">Preview PDF →</div>
            </div>
          </a>
        `).join("");

      document.querySelectorAll(".pdf-card").forEach(card => {
        card.addEventListener("click", event => {
          event.preventDefault();
          openPDF(PDFs[Number(card.dataset.pdfIndex)]);
        });
      });
    }

    document.getElementById("pdfClose").addEventListener("click", closePDF);

    document.getElementById("pdfModal").addEventListener("click", event => {
      if (event.target.id === "pdfModal") closePDF();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closePDF();
    });

    renderPDFs();
  </script>
</body>
</html>
